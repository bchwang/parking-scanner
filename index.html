<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리조트 실시간 차량 스캔</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
        }
        /* App Container with smooth color transitions */
        #app-container {
            transition: background-color 0.3s ease-in-out;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Camera View Finder */
        #camera-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #111;
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures video fills the area without distortion */
            transform: scale(1.05); /* Slight scale to hide edges */
        }
        /* Scanning Guideline Overlay */
        .scan-guideline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 30%;
            border: 4px dashed rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4); /* Darkens everything outside the box */
            pointer-events: none;
        }

        /* Result Overlay Animations */
        .result-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .result-overlay.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 50;
        }
        
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 기본 배경은 어두운 회색 -->
    <div id="app-container" class="bg-gray-900">
        
        <!-- 헤더 영역 -->
        <header class="pt-12 pb-4 px-6 text-center text-white z-10 relative shadow-md bg-black/40">
            <h1 class="text-3xl font-black tracking-tight">주차 단속 스캐너</h1>
            <p class="text-gray-300 text-lg font-medium mt-1" id="status-text">후면 카메라 준비 중...</p>
        </header>

        <!-- 카메라 화면 영역 -->
        <div id="camera-wrapper">
            <video id="camera-feed" autoplay playsinline muted></video>
            <div class="scan-guideline"></div>
            <p class="absolute bottom-6 w-full text-center text-white/80 text-xl font-bold font-sans">
                번호판을 사각형 안에 맞추세요
            </p>
        </div>

        <!-- 하단 조작 영역 -->
        <div class="p-6 bg-black/60 backdrop-blur-md pb-10 z-10">
            <button id="scan-trigger-btn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-black text-3xl py-6 rounded-2xl shadow-[0_8px_0_#b48600] active:shadow-none active:translate-y-2 transition-all">
                <i class="fa-solid fa-camera mr-3"></i>번호판 스캔하기
            </button>
        </div>

        <!-- 결과 오버레이 (판독 완료 시 전체 화면 덮음) -->
        <div id="result-overlay" class="result-overlay absolute inset-0 flex flex-col items-center justify-center text-white px-4 text-center">
            
            <div id="result-icon-box" class="w-40 h-40 rounded-full flex items-center justify-center mb-8 shadow-2xl bg-white/20 backdrop-blur-sm pulse-animation">
                <i id="result-icon" class="fa-solid fa-check text-7xl"></i>
            </div>
            
            <h2 id="result-plate" class="text-6xl font-black mb-4 tracking-widest drop-shadow-lg">12가3456</h2>
            <h3 id="result-title" class="text-5xl font-black mb-8 drop-shadow-md">캐디 차량</h3>
            
            <p id="result-desc" class="text-2xl font-bold opacity-90 bg-black/30 px-6 py-3 rounded-full">
                정상 주차 대상입니다.
            </p>

            <button id="close-result-btn" class="mt-16 bg-white/20 border-2 border-white text-white font-bold text-2xl py-4 px-12 rounded-full hover:bg-white/30 transition">
                화면 닫기
            </button>
        </div>

        <!-- 수동 입력 모달 (테스트용) -->
        <div id="mock-input-modal" class="hidden absolute inset-0 z-50 bg-black/80 flex items-center justify-center px-4">
            <div class="bg-white rounded-3xl w-full max-w-sm p-8 text-center">
                <h3 class="text-3xl font-black text-gray-800 mb-2">번호판 테스트</h3>
                <p class="text-gray-500 text-lg font-medium mb-6">OCR 판독 결과를 시뮬레이션합니다.</p>
                
                <input type="text" id="mock-plate-input" class="w-full text-center text-4xl font-black py-4 border-b-4 border-gray-300 focus:outline-none focus:border-blue-600 mb-6 uppercase" placeholder="12가3456" autocomplete="off">
                
                <div class="text-left text-sm text-gray-500 bg-gray-100 p-4 rounded-xl mb-6">
                    <p class="font-bold mb-1">테스트 케이스:</p>
                    <p>• 12가3456 (캐디 차량)</p>
                    <p>• 34다5678 (객실 차량)</p>
                    <p>• 기타 번호 (미등록 차량)</p>
                </div>

                <div class="flex gap-4">
                    <button id="cancel-input-btn" class="flex-1 py-4 text-xl font-bold text-gray-500 bg-gray-100 rounded-xl">취소</button>
                    <button id="submit-input-btn" class="flex-1 py-4 text-xl font-bold text-white bg-blue-600 rounded-xl">판독</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        // Firebase Firestore 모듈 임포트 (추후 백엔드 연결 시 사용될 뼈대)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 (현재는 플레이스홀더, 실제 연결 시 채워넣게 됩니다)
        const firebaseConfig = {}; 
        // const app = initializeApp(firebaseConfig);
        // const db = getFirestore(app);

        // UI 요소 가져오기
        const appContainer = document.getElementById('app-container');
        const videoElement = document.getElementById('camera-feed');
        const statusText = document.getElementById('status-text');
        
        const scanBtn = document.getElementById('scan-trigger-btn');
        
        const mockModal = document.getElementById('mock-input-modal');
        const mockInput = document.getElementById('mock-plate-input');
        const submitInputBtn = document.getElementById('submit-input-btn');
        const cancelInputBtn = document.getElementById('cancel-input-btn');

        const resultOverlay = document.getElementById('result-overlay');
        const resultIcon = document.getElementById('result-icon');
        const resultPlate = document.getElementById('result-plate');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const closeResultBtn = document.getElementById('close-result-btn');

        // 1. 후면 카메라 초기화 로직
        async function initCamera() {
            try {
                // 모바일 후면 카메라를 우선적으로 요청
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment", // 후면 카메라
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                videoElement.srcObject = stream;
                statusText.textContent = "화면 중앙에 번호판을 맞추세요";
                statusText.classList.replace('text-gray-300', 'text-green-400');
            } catch (error) {
                console.error("카메라 접근 에러:", error);
                statusText.textContent = "카메라 접근 권한이 필요합니다.";
                statusText.classList.replace('text-gray-300', 'text-red-400');
                // 카메라가 없는 PC 환경 등을 위한 폴백 디자인 유지
            }
        }

        // 페이지 로드 시 카메라 실행
        window.addEventListener('load', initCamera);

        // 2. 모의 입력창(팝업) 열기 및 닫기
        scanBtn.addEventListener('click', () => {
            mockModal.classList.remove('hidden');
            mockInput.value = ''; // 초기화
            setTimeout(() => mockInput.focus(), 100);
        });

        cancelInputBtn.addEventListener('click', () => {
            mockModal.classList.add('hidden');
        });

        // 3. 판독 처리 로직 (이곳에 추후 Firebase 조회 코드가 들어갑니다)
        submitInputBtn.addEventListener('click', () => {
            const plateNumber = mockInput.value.trim().replace(/\s+/g, '');
            if (!plateNumber) return;

            mockModal.classList.add('hidden');
            processPlate(plateNumber);
        });

        // 엔터키 지원
        mockInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitInputBtn.click();
        });

        // 4. 차량 정보 판별 및 화면 색상/텍스트 변경 함수
        function processPlate(plateNumber) {
            // 초기화 (기존 클래스 제거)
            appContainer.classList.remove('bg-gray-900', 'bg-blue-600', 'bg-green-600', 'bg-red-600');
            resultIcon.className = "fa-solid text-7xl"; // 아이콘 클래스 초기화

            // 화면에 번호 표시
            resultPlate.textContent = plateNumber;

            // 시뮬레이션 로직 (추후 Firebase DB 결과로 대체)
            if (plateNumber === "12가3456") {
                
                // [파란색] 캐디 차량
                appContainer.classList.add('bg-blue-600');
                resultIcon.classList.add('fa-car', 'text-white');
                resultTitle.textContent = "캐디 차량";
                resultDesc.textContent = "지정 구역 주차 대상입니다.";
                resultDesc.className = "text-2xl font-bold opacity-100 bg-blue-900/60 text-white px-6 py-3 rounded-full";

            } else if (plateNumber === "34다5678") {
                
                // [초록색] 콘도 객실 차량
                appContainer.classList.add('bg-green-600');
                resultIcon.classList.add('fa-house-user', 'text-white');
                resultTitle.textContent = "객실 차량";
                resultDesc.textContent = "정상 등록된 숙박 차량입니다.";
                resultDesc.className = "text-2xl font-bold opacity-100 bg-green-900/60 text-white px-6 py-3 rounded-full";

            } else {
                
                // [빨간색] 미등록 / 불법 주차 차량
                appContainer.classList.add('bg-red-600');
                resultIcon.classList.add('fa-triangle-exclamation', 'text-red-200');
                resultTitle.textContent = "미등록 차량";
                resultTitle.classList.add('text-red-100'); // 글씨를 약간 붉은 빛 도는 흰색으로
                resultDesc.textContent = "단속 및 이동 주차 대상입니다!";
                resultDesc.className = "text-2xl font-bold opacity-100 bg-black/60 text-yellow-300 px-6 py-3 rounded-full pulse-animation";
                
                // 경고음 효과 (Web Audio API 활용 가능하나 여기서는 시각적 효과에 집중)
            }

            // 결과 화면 오버레이 띄우기
            resultOverlay.classList.add('active');
        }

        // 5. 결과 화면 닫기 (카메라 화면으로 복귀)
        closeResultBtn.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
            
            // 배경색 원상복구
            setTimeout(() => {
                appContainer.className = "bg-gray-900";
            }, 300); // fade out 애니메이션 시간과 맞춤
        });

    </script>
</body>
</html>
