<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에스텍 주차 단속 스캐너</title>
    
    <!-- ⬇️ 크롬이 앱으로 인식하게 만드는 신분증(매니페스트) 연결 ⬇️ -->
    <link rel="manifest" href="manifest.json">
    
    <!-- 스마트폰 홈 화면 에스텍 로고 -->
    <link rel="icon" type="image/png" href="./stec.png?v=4">
    <link rel="apple-touch-icon" href="./stec.png?v=4">
    <link rel="shortcut icon" href="./stec.png?v=4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="단속스캐너">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            margin: 0; background-color: #121212; color: white; 
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden; 
        }
        #camera-view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        
        /* ⬇️ 상단바 글씨 및 로고 확대 ⬇️ */
        .header { 
            display: flex; align-items: center; padding: 15px 20px; 
            background: rgba(0,0,0,0.85); border-bottom: 2px solid #333;
        }
        .header img { height: 60px; margin-right: 15px; } /* 로고 더 크게 */
        .header-text { text-align: left; }
        .header-text h2 { margin: 0; font-size: 26px; color: #ffcc00; letter-spacing: -0.5px; } /* 제목 확대 */
        .header-text p { margin: 5px 0 0 0; font-size: 15px; color: #ccc; letter-spacing: -0.5px; }
        
        /* ⬇️ 스캔 박스(관심 영역) 높이 및 안내 문구 확대 ⬇️ */
        .scanner-box { 
            border: 4px dashed #ffcc00; width: 85%; height: 160px; /* 스캔 영역 확대 */
            margin: 80px auto; border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
        }
        .guide-text { text-align: center; margin-top: 15px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px black; }
        
        /* ⬇️ 스캔 버튼 특대형 확대 ⬇️ */
        .btn-scan { 
            position: fixed; bottom: 40px; left: 5%; width: 90%; padding: 25px; 
            font-size: 28px; font-weight: bold; background-color: #ffcc00; 
            color: black; border: none; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-scan:active { background-color: #e6b800; }

        /* ⬇️ 관리자 화면 글씨 확대 ⬇️ */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.1); padding: 40px 30px; border-radius: 15px; 
            text-align: center; border: 2px solid #ffcc00; width: 80%; max-width: 350px;
        }
        .login-box input {
            font-size: 24px; padding: 15px; text-align: center; margin: 20px 0; width: 85%;
            border-radius: 8px; border: none; outline: none;
        }
        .login-box button {
            font-size: 24px; padding: 15px; width: 95%; background-color: #ffcc00; color: black;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 잠금 화면 -->
    <div id="login-screen">
        <div class="login-box">
            <img src="stec.png?v=4" style="height: 70px; margin-bottom: 15px;" onerror="this.style.display='none'">
            <h2 style="color: #ffcc00; margin: 0 0 5px 0; font-size: 28px;">관리자 인증</h2>
            <p style="color: #aaa; font-size: 16px; margin: 0;">에스텍 보안 시스템</p>
            <input type="password" id="admin-pw" placeholder="암호 입력">
            <button onclick="checkPassword()">접속하기</button>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div class="header">
        <img src="pine.png?v=2" alt="양지파인리조트">
        <div class="header-text">
            <h2>에스텍 주차 단속 스캐너</h2>
            <p>양지파인리조트 차량 관리 시스템</p>
        </div>
    </div>

    <video id="camera-view" autoplay playsinline></video>

    <div class="scanner-box"></div>
    <div class="guide-text">밝은 사각형 안에 번호판을 맞추세요</div>

    <button class="btn-scan" onclick="scanVehicle()">📸 정밀 스캔</button>

    <script>
        const ADMIN_PASSWORD = "1234"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDw-XMdIUdIuPiU3jVqfUA9PMUMOpbz_C0",
            authDomain: "pine-parking.firebaseapp.com",
            projectId: "pine-parking",
            storageBucket: "pine-parking.firebasestorage.app",
            messagingSenderId: "393576522385",
            appId: "1:393576522385:web:ee06f5626edafd247e9530"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const PROXY_URL = "https://script.google.com/macros/s/AKfycbzxrR1Jv04T0P60noq5VCmIfNhEP5LrwyeadOxm4AnEIcM8lwqNlipDJkZzJ-p7HAGmPA/exec";
        const NAVER_OCR_URL = "https://ws0j6fezk4.apigw.ntruss.com/custom/v1/57662/d2922372131239317837d760004d37d0b2ca5f803a6c9c4060c565d63c216609/general";
        const NAVER_SECRET_KEY = "cnFLSkpSZE9GTGhYZENadFFidFhGWUpDRVlUVWNjU3I=";

        window.onload = function() {
            if (localStorage.getItem('estec_auth') === 'true') {
                document.getElementById('login-screen').style.display = 'none';
                startCamera();
            }
        };

        function checkPassword() {
            const inputPw = document.getElementById('admin-pw').value;
            if (inputPw === ADMIN_PASSWORD) {
                localStorage.setItem('estec_auth', 'true');
                document.getElementById('login-screen').style.display = 'none';
                startCamera();
            } else {
                Swal.fire({ icon: 'error', title: '인증 실패', text: '비밀번호가 일치하지 않습니다.' });
                document.getElementById('admin-pw').value = '';
            }
        }

        function startCamera() {
            const video = document.getElementById('camera-view');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function(stream) { video.srcObject = stream; })
                .catch(function(error) { Swal.fire('카메라 오류', '권한을 허용해주세요.', 'error'); });
            }
        }

        async function recognizePlateFromNaver(base64Image) {
            const base64Data = base64Image.split(',')[1];
            const requestBody = {
                version: "V2", requestId: "pine-" + Date.now(), timestamp: Date.now(),
                images: [{ format: "jpeg", name: "plate", data: base64Data }] 
            };
            const proxyBody = { url: NAVER_OCR_URL, secretKey: NAVER_SECRET_KEY, payload: requestBody };

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(proxyBody)
                });
                if (!response.ok) throw new Error("에러코드: " + response.status);
                const result = await response.json();
                
                if (result.images && result.images[0].fields && result.images[0].fields.length > 0) {
                    const texts = result.images[0].fields.map(field => field.inferText);
                    const rawText = texts.join('').replace(/\s/g, ''); 
                    const platePattern = rawText.match(/\d{2,3}[가-힣]\d{4}/);
                    if (platePattern) return platePattern[0]; else return rawText; 
                } else return null; 
            } catch (error) {
                Swal.close(); alert("통신 에러: " + error.message); return null; 
            }
        }

        async function scanVehicle() {
            Swal.fire({
                title: '정밀 판독 중...', text: '인공지능이 번호판을 분석하고 있습니다.',
                allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }
            });

            const canvas = document.createElement('canvas');
            const videoWidth = document.getElementById('camera-view').videoWidth;
            const videoHeight = document.getElementById('camera-view').videoHeight;
            
            const cropWidth = videoWidth * 0.75;  
            const cropHeight = videoHeight * 0.3; 
            const startX = (videoWidth - cropWidth) / 2;
            const startY = (videoHeight - cropHeight) / 2;

            canvas.width = cropWidth; canvas.height = cropHeight;
            canvas.getContext('2d').drawImage(document.getElementById('camera-view'), startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);

            let carNumber = await recognizePlateFromNaver(base64Image);

            if (!carNumber) {
                const manualInput = await Swal.fire({
                    icon: 'warning', title: '인식 실패', text: '직접 번호를 입력하시겠습니까?',
                    input: 'text', inputPlaceholder: '예: 12가3456',
                    showCancelButton: true, confirmButtonText: '조회', cancelButtonText: '취소'
                });
                if (manualInput.isConfirmed && manualInput.value) {
                    carNumber = manualInput.value.replace(/\s/g, '');
                } else return; 
            }

            const docRef = db.collection('vehicles').doc(carNumber);
            docRef.get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    // ⬇️ 팝업 결과창 글씨 특대형으로 수정 ⬇️
                    if (data.type === '캐디') {
                        Swal.fire({ icon: 'info', title: '<h2 style="font-size: 40px; margin: 0;">캐디 차량</h2>', html: `<div style="font-size: 55px; font-weight: bold; color: #008394; margin-top: 15px; letter-spacing: -1px;">${carNumber}</div>`, background: '#e0f7fa', confirmButtonColor: '#00bcd4' });
                    } else if (data.type === '객실') {
                        Swal.fire({ icon: 'success', title: '<h2 style="font-size: 40px; margin: 0;">객실 차량</h2>', html: `<div style="font-size: 55px; font-weight: bold; color: #2e7d32; margin-top: 15px; letter-spacing: -1px;">${carNumber}</div>`, background: '#e8f5e9', confirmButtonColor: '#4caf50' });
                    } else {
                        Swal.fire({ icon: 'success', title: '<h2 style="font-size: 40px; margin: 0;">등록 차량</h2>', html: `<div style="font-size: 55px; font-weight: bold; color: #2e7d32; margin-top: 15px; letter-spacing: -1px;">${carNumber}</div><div style="font-size: 30px; color: #555; margin-top: 10px; font-weight: bold;">구분: ${data.type}</div>`, confirmButtonColor: '#4caf50' });
                    }
                } else {
                    Swal.fire({ icon: 'error', title: '<h2 style="font-size: 40px; margin: 0; color: #d32f2f;">미등록 차량<br><span style="font-size: 26px;">(불법주차)</span></h2>', html: `<div style="font-size: 55px; font-weight: bold; color: #c62828; margin-top: 15px; letter-spacing: -1px;">${carNumber}</div>`, background: '#ffebee', confirmButtonColor: '#f44336' });
                }
            }).catch((error) => { Swal.fire('오류 발생', '데이터베이스 연결을 확인하세요.', 'error'); });
        }
    </script>
</body>
</html>
