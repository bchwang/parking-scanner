<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에스텍 주차 단속 스캐너</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            margin: 0; background-color: #121212; color: white; 
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden; 
        }
        #camera-view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        .header { 
            text-align: center; padding: 15px; background: rgba(0,0,0,0.7); 
            border-bottom: 2px solid #333;
        }
        .header h2 { margin: 0; font-size: 22px; color: #ffcc00; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }
        
        .scanner-box { 
            border: 3px dashed #ffcc00; width: 80%; height: 120px; 
            margin: 100px auto; border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        .guide-text { text-align: center; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        
        .btn-scan { 
            position: fixed; bottom: 40px; left: 10%; width: 80%; padding: 20px; 
            font-size: 24px; font-weight: bold; background-color: #ffcc00; 
            color: black; border: none; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-scan:active { background-color: #e6b800; }
    </style>
</head>
<body>

    <div class="header">
        <h2>에스텍 주차 단속 스캐너</h2>
        <p>양지파인리조트 차량 관리 시스템</p>
    </div>

    <video id="camera-view" autoplay playsinline></video>

    <div class="scanner-box"></div>
    <div class="guide-text">차량 번호판을 사각형 안에 맞추세요</div>

    <button class="btn-scan" onclick="scanVehicle()">📸 번호판 스캔</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDw-XMdIUdIuPiU3jVqfUA9PMUMOpbz_C0",
            authDomain: "pine-parking.firebaseapp.com",
            projectId: "pine-parking",
            storageBucket: "pine-parking.firebasestorage.app",
            messagingSenderId: "393576522385",
            appId: "1:393576522385:web:ee06f5626edafd247e9530"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const NAVER_OCR_URL = "https://ws0j6fezk4.apigw.ntruss.com/custom/v1/57662/d2922372131239317837d760004d37d0b2ca5f803a6c9c4060c565d63c216609/general";
        const NAVER_SECRET_KEY = "cnFLSkpSZE9GTGhYZENadFFidFhGWUpDRVlUVWNjU3I=";

        const video = document.getElementById('camera-view');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                Swal.fire('카메라 오류', '카메라 권한을 허용해주세요.', 'error');
            });
        }

        async function recognizePlateFromNaver(base64Image) {
            const base64Data = base64Image.split(',')[1];
            const requestBody = {
                version: "V2",
                requestId: "pine-" + Date.now(),
                timestamp: Date.now(),
                images: [{ format: "jpeg", name: "plate", data: base64Data }]
            };

            try {
                const response = await fetch(NAVER_OCR_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-OCR-SECRET': NAVER_SECRET_KEY
                    },
                    body: JSON.stringify(requestBody)
                });

                // 에러 발생 시 상세 원인 파악을 위한 코드
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(response.status + " / " + errorText);
                }

                const result = await response.json();
                
                if (result.images && result.images[0].fields && result.images[0].fields.length > 0) {
                    const texts = result.images[0].fields.map(field => field.inferText);
                    return texts.join('').replace(/\s/g, ''); 
                } else {
                    return null; 
                }
            } catch (error) {
                // 어떤 에러인지 팝업으로 띄워줍니다!
                Swal.close();
                alert("네이버 통신 에러: " + error.message);
                return null; 
            }
        }

        async function scanVehicle() {
            const canvas = document.createElement('canvas');
            
            // [추가된 부분] 스마트폰 카메라 사진 용량을 대폭 압축 (가로 최대 800픽셀)
            const MAX_WIDTH = 800;
            const scale = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
            canvas.width = video.videoWidth * scale;
            canvas.height = video.videoHeight * scale;
            
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 사진 화질을 60%로 낮춰서 용량 다이어트 (0.6)
            const base64Image = canvas.toDataURL('image/jpeg', 0.6);

            Swal.fire({
                title: '번호판 판독 중...',
                text: '네이버 AI가 번호를 분석하고 있습니다.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            let carNumber = await recognizePlateFromNaver(base64Image);

            if (!carNumber) {
                const manualInput = await Swal.fire({
                    icon: 'warning',
                    title: '인식 실패',
                    text: '번호판을 명확히 인식하지 못했습니다. 직접 입력하시겠습니까?',
                    input: 'text',
                    inputPlaceholder: '예: 12가3456',
                    showCancelButton: true,
                    confirmButtonText: '조회',
                    cancelButtonText: '취소'
                });

                if (manualInput.isConfirmed && manualInput.value) {
                    carNumber = manualInput.value.replace(/\s/g, '');
                } else {
                    return; 
                }
            }

            const docRef = db.collection('vehicles').doc(carNumber);
            
            docRef.get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.type === '캐디') {
                        Swal.fire({ icon: 'info', title: '캐디 차량', text: carNumber, background: '#e0f7fa', confirmButtonColor: '#00bcd4' });
                    } else if (data.type === '객실') {
                        Swal.fire({ icon: 'success', title: '객실 차량', text: carNumber, background: '#e8f5e9', confirmButtonColor: '#4caf50' });
                    } else {
                        Swal.fire({ icon: 'success', title: '등록 차량', text: `차량번호: ${carNumber} / 구분: ${data.type}`, confirmButtonColor: '#4caf50' });
                    }
                } else {
                    Swal.fire({ icon: 'error', title: '미등록 차량 (불법주차)', text: carNumber, background: '#ffebee', confirmButtonColor: '#f44336' });
                }
            }).catch((error) => {
                Swal.fire('오류 발생', '데이터베이스 연결을 확인하세요.', 'error');
            });
        }
    </script>
</body>
</html>
