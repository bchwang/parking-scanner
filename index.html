<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에스텍 주차 단속 스캐너</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            margin: 0; background-color: #121212; color: white; 
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden; 
        }
        #camera-view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        .header { 
            text-align: center; padding: 15px; background: rgba(0,0,0,0.7); 
            border-bottom: 2px solid #333;
        }
        .header h2 { margin: 0; font-size: 22px; color: #ffcc00; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }
        
        .scanner-box { 
            border: 3px dashed #ffcc00; width: 80%; height: 120px; 
            margin: 100px auto; border-radius: 10px;
            background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .guide-text { text-align: center; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        
        .btn-scan { 
            position: fixed; bottom: 40px; left: 10%; width: 80%; padding: 20px; 
            font-size: 24px; font-weight: bold; background-color: #ffcc00; 
            color: black; border: none; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-scan:active { background-color: #e6b800; }
    </style>
</head>
<body>

    <div class="header">
        <h2>에스텍 주차 단속 스캐너</h2>
        <p>양지파인리조트 차량 관리 시스템</p>
    </div>

    <video id="camera-view" autoplay playsinline></video>

    <div class="scanner-box"></div>
    <div class="guide-text">노란 점선 사각형 안에 번호판을 맞추세요</div>

    <button class="btn-scan" onclick="scanVehicle()">📸 정밀 스캔</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDw-XMdIUdIuPiU3jVqfUA9PMUMOpbz_C0",
            authDomain: "pine-parking.firebaseapp.com",
            projectId: "pine-parking",
            storageBucket: "pine-parking.firebasestorage.app",
            messagingSenderId: "393576522385",
            appId: "1:393576522385:web:ee06f5626edafd247e9530"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. 구글 중계 서버 주소
        const PROXY_URL = "https://script.google.com/macros/s/AKfycbzxrR1Jv04T0P60noq5VCmIfNhEP5LrwyeadOxm4AnEIcM8lwqNlipDJkZzJ-p7HAGmPA/exec";

        // 2. 네이버 원본 정보
        const NAVER_OCR_URL = "https://ws0j6fezk4.apigw.ntruss.com/custom/v1/57662/d2922372131239317837d760004d37d0b2ca5f803a6c9c4060c565d63c216609/general";
        const NAVER_SECRET_KEY = "cnFLSkpSZE9GTGhYZENadFFidFhGWUpDRVlUVWNjU3I=";

        const video = document.getElementById('camera-view');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                Swal.fire('카메라 오류', '카메라 권한을 허용해주세요.', 'error');
            });
        }

        // [수정됨] 네이버에게 사진을 보낼 때, 가운데 영역만 잘라서(roi) 보내는 함수
        async function recognizePlateFromNaver(base64Image, videoWidth, videoHeight) {
            const base64Data = base64Image.split(',')[1];

            // --- 핵심 수정 부분 ---
            // 스마트폰 카메라 화면의 정중앙(가로 50%, 세로 40%)에 있는 영역만 잘라서 인식하라 설정
            const cropWidth = Math.round(videoWidth * 0.7);   // 화면 너비의 70%
            const cropHeight = Math.round(videoHeight * 0.3); // 화면 높이의 30%
            const cropX = Math.round((videoWidth - cropWidth) / 2);   // 가운데 정렬 X좌표
            const cropY = Math.round((videoHeight - cropHeight) / 2); // 가운데 정렬 Y좌표

            const requestBody = {
                version: "V2",
                requestId: "pine-" + Date.now(),
                timestamp: Date.now(),
                images: [{
                    format: "jpeg",
                    name: "plate",
                    data: base64Data,
                    // 네이버 OCR에게 사진의 'roi' (관심 영역) 좌표를 알려줌
                    "roi": {
                        "x": cropX,
                        "y": cropY,
                        "w": cropWidth,
                        "h": cropHeight
                    }
                }]
            };
            // --- 핵심 수정 끝 ---

            const proxyBody = {
                url: NAVER_OCR_URL,
                secretKey: NAVER_SECRET_KEY,
                payload: requestBody
            };

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(proxyBody)
                });

                if (!response.ok) {
                    throw new Error("HTTP 에러코드: " + response.status);
                }

                const result = await response.json();
                
                if (result.images && result.images[0].fields && result.images[0].fields.length > 0) {
                    const texts = result.images[0].fields.map(field => field.inferText);
                    return texts.join('').replace(/\s/g, ''); 
                } else {
                    return null; 
                }
            } catch (error) {
                Swal.close();
                alert("통신 에러: " + error.message);
                return null; 
            }
        }

        async function scanVehicle() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const scale = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
            canvas.width = video.videoWidth * scale;
            canvas.height = video.videoHeight * scale;
            
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.6);

            Swal.fire({
                title: '정밀 판독 중...',
                text: '네이버 AI가 중앙의 번호판을 분석하고 있습니다.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // [수정됨] 인식 함수에 실제 캡처된 사진의 가로/세로 크기를 함께 전달
            let carNumber = await recognizePlateFromNaver(base64Image, video.videoWidth, video.videoHeight);

            if (!carNumber) {
                const manualInput = await Swal.fire({
                    icon: 'warning',
                    title: '인식 실패',
                    text: '가운데 사각형 안에 번호판을 정확히 맞춰주세요. 직접 입력하시겠습니까?',
                    input: 'text',
                    inputPlaceholder: '예: 12가3456',
                    showCancelButton: true,
                    confirmButtonText: '조회',
                    cancelButtonText: '다시 스캔'
                });

                if (manualInput.isConfirmed && manualInput.value) {
                    carNumber = manualInput.value.replace(/\s/g, '');
                } else {
                    return; 
                }
            }

            const cleanNumber = carNumber;
            const docRef = db.collection('vehicles').doc(cleanNumber);
            
            docRef.get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.type === '캐디') {
                        Swal.fire({ icon: 'info', title: '캐디 차량', text: cleanNumber, background: '#e0f7fa', confirmButtonColor: '#00bcd4' });
                    } else if (data.type === '객실') {
                        Swal.fire({ icon: 'success', title: '객실 차량', text: cleanNumber, background: '#e8f5e9', confirmButtonColor: '#4caf50' });
                    } else {
                        Swal.fire({ icon: 'success', title: '등록 차량', text: `차량번호: ${cleanNumber} / 구분: ${data.type}`, confirmButtonColor: '#4caf50' });
                    }
                } else {
                    Swal.fire({ icon: 'error', title: '미등록 차량 (불법주차)', text: cleanNumber, background: '#ffebee', confirmButtonColor: '#f44336' });
                }
            }).catch((error) => {
                Swal.fire('오류 발생', '데이터베이스 연결을 확인하세요.', 'error');
            });
        }
    </script>
</body>
</html>
