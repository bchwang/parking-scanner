<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에스텍 주차 단속 스캐너</title>
    
    <!-- Firebase 데이터베이스 연결 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- 화려한 색상 팝업(알림창)을 위한 SweetAlert2 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            margin: 0; background-color: #121212; color: white; 
            font-family: 'Malgun Gothic', sans-serif; overflow: hidden; 
        }
        /* 스마트폰 카메라 화면을 전체화면 배경으로 깔기 */
        #camera-view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        .header { 
            text-align: center; padding: 15px; background: rgba(0,0,0,0.7); 
            border-bottom: 2px solid #333;
        }
        .header h2 { margin: 0; font-size: 22px; color: #ffcc00; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }
        
        /* 번호판을 맞추는 가이드라인 */
        .scanner-box { 
            border: 3px dashed #ffcc00; width: 80%; height: 120px; 
            margin: 100px auto; border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        .guide-text { text-align: center; margin-top: 10px; font-weight: bold; }
        
        /* 거대한 스캔 버튼 */
        .btn-scan { 
            position: fixed; bottom: 40px; left: 10%; width: 80%; padding: 20px; 
            font-size: 24px; font-weight: bold; background-color: #ffcc00; 
            color: black; border: none; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-scan:active { background-color: #e6b800; }
    </style>
</head>
<body>

    <div class="header">
        <h2>에스텍 주차 단속 스캐너</h2>
        <p>양지파인리조트 차량 관리 시스템</p>
    </div>

    <!-- 카메라 화면 출력 영역 -->
    <video id="camera-view" autoplay playsinline></video>

    <div class="scanner-box"></div>
    <div class="guide-text">차량 번호판을 사각형 안에 맞추세요</div>

    <button class="btn-scan" onclick="scanVehicle()">📸 번호판 확인</button>

    <script>
        // 1. 황박사님의 Firebase 프로젝트 연결 열쇠
        const firebaseConfig = {
            apiKey: "AIzaSyDw-XMdIUdIuPiU3jVqfUA9PMUMOpbz_C0",
            authDomain: "pine-parking.firebaseapp.com",
            projectId: "pine-parking",
            storageBucket: "pine-parking.firebasestorage.app",
            messagingSenderId: "393576522385",
            appId: "1:393576522385:web:ee06f5626edafd247e9530"
        };
        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. 스마트폰 후면 카메라 실행
        const video = document.getElementById('camera-view');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                console.log("카메라를 켤 수 없습니다:", error);
            });
        }

        // 3. 번호판 확인 로직 (버튼 클릭 시 작동)
        async function scanVehicle() {
            // 현재는 팝업창을 띄워 번호를 입력받아 즉시 테스트하도록 구성
            const { value: carNumber } = await Swal.fire({
                title: '차량 번호 입력',
                input: 'text',
                inputPlaceholder: '예: 12가3456',
                showCancelButton: true,
                confirmButtonText: '조회',
                cancelButtonText: '취소'
            });

            if (carNumber) {
                // 입력된 번호에서 공백 제거 (DB 검색의 정확도를 위해)
                const cleanNumber = carNumber.replace(/\s/g, ''); 
                
                // Firestore 데이터베이스의 'vehicles' 컬렉션에서 차량 검색
                const docRef = db.collection('vehicles').doc(cleanNumber);
                
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        
                        // 결과에 따른 색상 및 메시지 출력
                        if (data.type === '캐디') {
                            Swal.fire({ 
                                icon: 'info', title: '캐디 차량', text: cleanNumber, 
                                background: '#e0f7fa', confirmButtonColor: '#00bcd4' 
                            });
                        } else if (data.type === '객실') {
                            Swal.fire({ 
                                icon: 'success', title: '객실 차량', text: cleanNumber, 
                                background: '#e8f5e9', confirmButtonColor: '#4caf50' 
                            });
                        } else {
                            Swal.fire({ 
                                icon: 'success', title: '등록 차량', text: `구분: ${data.type}`, 
                                confirmButtonColor: '#4caf50' 
                            });
                        }
                    } else {
                        // DB에 없는 번호일 경우 경고
                        Swal.fire({ 
                            icon: 'error', title: '미등록 차량 (불법주차)', text: cleanNumber, 
                            background: '#ffebee', confirmButtonColor: '#f44336' 
                        });
                    }
                }).catch((error) => {
                    Swal.fire('오류 발생', '데이터베이스 연결을 확인하세요.', 'error');
                    console.error("DB 에러:", error);
                });
            }
        }
    </script>
</body>
</html>
